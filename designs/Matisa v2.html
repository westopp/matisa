<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Matisa</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "Geist Mono", "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --radius-sm: 6px;
    --radius: 10px;
    --radius-lg: 14px;
    --radius-xl: 20px;
  }

  /* ---------- DARK (default) ---------- */
  :root, [data-theme="dark"] {
    --window-bg: oklch(0.165 0.005 270);
    --sidebar-bg: oklch(0.195 0.005 270);
    --titlebar-bg: oklch(0.215 0.005 270);
    --panel-bg: oklch(0.185 0.005 270);
    --card-bg: oklch(0.225 0.005 270);
    --card-bg-hover: oklch(0.265 0.005 270);
    --card-bg-active: oklch(0.31 0.008 270);
    --chip-bg: oklch(0.28 0.005 270);
    --input-bg: oklch(0.215 0.005 270);

    --border: oklch(0.295 0.005 270);
    --border-soft: oklch(0.255 0.005 270);
    --border-strong: oklch(0.38 0.006 270);

    --text: oklch(0.965 0.003 270);
    --text-muted: oklch(0.72 0.008 270);
    --text-dim: oklch(0.55 0.01 270);
    --text-faint: oklch(0.42 0.012 270);

    --accent: oklch(0.74 0.16 268);
    --accent-soft: oklch(0.74 0.16 268 / 0.14);
    --accent-fg: oklch(0.18 0.02 268);

    --success: oklch(0.78 0.17 152);
    --success-soft: oklch(0.78 0.17 152 / 0.16);
    --danger: oklch(0.7 0.21 24);
    --danger-soft: oklch(0.7 0.21 24 / 0.16);
    --warning: oklch(0.82 0.15 80);
    --warning-soft: oklch(0.82 0.15 80 / 0.16);
    --info: oklch(0.75 0.13 230);
    --info-soft: oklch(0.75 0.13 230 / 0.14);
    --magenta: oklch(0.7 0.18 330);

    /* Lit-from-above gradient borders */
    --lit-top: oklch(0.46 0.008 270);
    --lit-bottom: oklch(0.22 0.005 270);
    --lit-grad: linear-gradient(180deg, var(--lit-top), var(--lit-bottom));

    /* Solid tinted backgrounds (icon chips, danger button) */
    --accent-tint: oklch(0.28 0.06 268);
    --accent-tint-top: oklch(0.42 0.09 268);
    --accent-tint-bot: oklch(0.24 0.05 268);

    --danger-tint: oklch(0.28 0.07 24);
    --danger-tint-top: oklch(0.42 0.11 24);
    --danger-tint-bot: oklch(0.24 0.06 24);

    --success-tint: oklch(0.27 0.06 152);
    --success-tint-top: oklch(0.40 0.10 152);
    --success-tint-bot: oklch(0.23 0.05 152);

    --info-tint: oklch(0.27 0.05 230);
    --info-tint-top: oklch(0.40 0.09 230);
    --info-tint-bot: oklch(0.23 0.04 230);

    --magenta-tint: oklch(0.27 0.06 330);
    --magenta-tint-top: oklch(0.40 0.10 330);
    --magenta-tint-bot: oklch(0.23 0.05 330);

    --warning-tint: oklch(0.30 0.07 80);
    --warning-tint-top: oklch(0.45 0.11 80);
    --warning-tint-bot: oklch(0.25 0.06 80);

    --shadow-card: 0 1px 0 oklch(1 0 0 / 0.04) inset, 0 8px 24px oklch(0 0 0 / 0.25);
    --shadow-pop: 0 16px 40px oklch(0 0 0 / 0.45), 0 2px 6px oklch(0 0 0 / 0.3);
    --shadow-inset: inset 0 1px 0 oklch(1 0 0 / 0.04);
  }

  /* ---------- LIGHT ---------- */
  [data-theme="light"] {
    --window-bg: oklch(0.965 0.004 270);
    --sidebar-bg: oklch(0.985 0.003 270);
    --titlebar-bg: oklch(0.945 0.004 270);
    --panel-bg: oklch(0.98 0.003 270);
    --card-bg: oklch(1 0 0);
    --card-bg-hover: oklch(0.965 0.004 270);
    --card-bg-active: oklch(0.94 0.006 270);
    --chip-bg: oklch(0.955 0.005 270);
    --input-bg: oklch(0.97 0.004 270);

    --border: oklch(0.9 0.006 270);
    --border-soft: oklch(0.93 0.005 270);
    --border-strong: oklch(0.8 0.008 270);

    --text: oklch(0.2 0.01 270);
    --text-muted: oklch(0.46 0.012 270);
    --text-dim: oklch(0.6 0.012 270);
    --text-faint: oklch(0.72 0.01 270);

    --accent: oklch(0.5 0.2 268);
    --accent-soft: oklch(0.5 0.2 268 / 0.1);
    --accent-fg: oklch(0.98 0 0);

    --success: oklch(0.55 0.18 152);
    --success-soft: oklch(0.55 0.18 152 / 0.12);
    --danger: oklch(0.56 0.22 24);
    --danger-soft: oklch(0.56 0.22 24 / 0.1);
    --warning: oklch(0.65 0.18 70);
    --warning-soft: oklch(0.65 0.18 70 / 0.12);
    --info: oklch(0.5 0.16 230);
    --info-soft: oklch(0.5 0.16 230 / 0.1);
    --magenta: oklch(0.55 0.22 330);

    /* Lit-from-above gradient borders */
    --lit-top: oklch(1 0 0);
    --lit-bottom: oklch(0.82 0.008 270);
    --lit-grad: linear-gradient(180deg, var(--lit-top), var(--lit-bottom));

    /* Solid tinted backgrounds */
    --accent-tint: oklch(0.94 0.04 268);
    --accent-tint-top: oklch(0.99 0.02 268);
    --accent-tint-bot: oklch(0.84 0.07 268);

    --danger-tint: oklch(0.95 0.04 24);
    --danger-tint-top: oklch(0.99 0.02 24);
    --danger-tint-bot: oklch(0.85 0.08 24);

    --success-tint: oklch(0.95 0.04 152);
    --success-tint-top: oklch(0.99 0.02 152);
    --success-tint-bot: oklch(0.85 0.07 152);

    --info-tint: oklch(0.95 0.04 230);
    --info-tint-top: oklch(0.99 0.02 230);
    --info-tint-bot: oklch(0.85 0.07 230);

    --magenta-tint: oklch(0.95 0.04 330);
    --magenta-tint-top: oklch(0.99 0.02 330);
    --magenta-tint-bot: oklch(0.85 0.07 330);

    --warning-tint: oklch(0.95 0.04 80);
    --warning-tint-top: oklch(0.99 0.02 80);
    --warning-tint-bot: oklch(0.85 0.08 80);

    --shadow-card: 0 1px 0 oklch(1 0 0 / 0.7) inset, 0 1px 2px oklch(0 0 0 / 0.04), 0 8px 24px oklch(0 0 0 / 0.05);
    --shadow-pop: 0 16px 40px oklch(0 0 0 / 0.12), 0 2px 6px oklch(0 0 0 / 0.06);
    --shadow-inset: inset 0 1px 0 oklch(1 0 0 / 0.5);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: var(--font-sans);
    background: oklch(0.08 0.005 270);
    color: var(--text);
    font-feature-settings: "ss01", "cv11";
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
  }
  [data-theme="light"] body { background: oklch(0.88 0.005 270); }

  /* desktop backdrop with subtle gradient */
  .desktop {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(900px 600px at 15% 10%, oklch(0.3 0.05 270 / 0.5), transparent 60%),
      radial-gradient(700px 500px at 85% 90%, oklch(0.35 0.05 220 / 0.4), transparent 60%),
      linear-gradient(180deg, oklch(0.12 0.01 270), oklch(0.07 0.005 270));
    display: grid;
    place-items: center;
    padding: 28px;
  }
  [data-theme="light"] .desktop {
    background:
      radial-gradient(900px 600px at 15% 10%, oklch(0.92 0.04 270 / 0.7), transparent 60%),
      radial-gradient(700px 500px at 85% 90%, oklch(0.93 0.04 220 / 0.6), transparent 60%),
      linear-gradient(180deg, oklch(0.93 0.01 270), oklch(0.88 0.005 270));
  }

  #root { width: 100%; height: 100%; display: contents; }

  /* hide scrollbars but keep functional */
  .scroll {
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border-strong) transparent;
  }
  .scroll::-webkit-scrollbar { width: 10px; height: 10px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
  .scroll::-webkit-scrollbar-track { background: transparent; }

  button { font: inherit; color: inherit; cursor: pointer; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="sidebar.jsx"></script>
<script type="text/babel" src="terminals.jsx"></script>
<script type="text/babel" src="main-panel.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
