server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A static page, not an SPA — a request for something that is not here is a
    # 404, not the homepage wearing the wrong URL.
    #
    # The no-cache is on this block rather than on `location = /index.html`,
    # because the page is reached as `/` and try_files resolves it internally —
    # an exact-match location on the filename never runs. index.html carries the
    # download link, rewritten by every publish, so it must not be held anywhere.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Assets are NOT content-hashed here — styles.css is styles.css from one
    # deploy to the next — so the year-long immutable cache the app builds use
    # would pin visitors to a stale stylesheet with no way to bust it. An hour,
    # revalidated, is the most this page can promise.
    #
    # One Cache-Control, set once: `expires` emits a header of its own, so
    # pairing it with add_header sends the directive twice.
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }
}
