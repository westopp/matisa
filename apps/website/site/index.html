<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Matisa</title>
    <meta name="description" content="A local project supervisor for macOS." />
    <meta name="theme-color" content="#08080a" />
    <link rel="icon" href="logo.png" type="image/png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Ambient layers, in paint order: light, then structure, then grain over
         everything. All three are decorative and aria-hidden by being empty. -->
    <div class="aurora"></div>
    <div class="frame"></div>

    <!--
      The download link and the version line below it are rewritten in place by
      scripts/publish.mjs, between the markers. Do not remove the markers, and do
      not hand-edit what sits between them — the next publish overwrites it. The
      href points at one release's versioned asset on the matisa-releases repo
      rather than at /releases/latest, so a cache can never hand someone
      yesterday's build under today's name. What is checked in below is the
      placeholder for before any build has been published: the release list,
      which is honest about there being nothing there yet.
    -->
    <main>
      <img class="logo" src="logo.png" alt="" width="256" height="256" />
      <h1>Matisa</h1>
      <p class="tagline">A local project supervisor. Your services, their ports and their environments, in one place.</p>

      <!-- download:start -->
      <a class="download" href="https://github.com/westopp/matisa-releases/releases/download/v0.1.0/Matisa-0.1.0-arm64.dmg"><svg class="apple" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg><span>Download for macOS</span></a>
      <p class="meta">Version 0.1.0 · 108MB</p>
      <!-- download:end -->
    </main>

    <p class="req">Requires macOS on Apple Silicon.</p>

    <div class="grain"></div>
  </body>
</html>
